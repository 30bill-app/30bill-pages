<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>30Bill document</title>
<style>
  html, body { margin: 0; height: 100%; background: #F5F7FA; font-family: Arial, Helvetica, sans-serif; }
  #msg { padding: 56px 24px; text-align: center; color: #475569; font-size: 15px; line-height: 1.5; }
  #msg strong { display: block; color: #1E293B; font-size: 18px; margin-bottom: 8px; }
  iframe { border: 0; width: 100%; height: 100%; display: none; background: #F5F7FA; }
</style>
</head>
<body>
<div id="msg">Loading your document&hellip;</div>
<iframe id="doc" title="30Bill document" sandbox="allow-scripts allow-modals allow-popups"></iframe>
<script>
(function () {
  // Public values only: the project address. No keys or secrets live on this page.
  var SUPABASE_URL = "https://shhgxzfkqxlvhcgufwdo.supabase.co";
  var msg = document.getElementById("msg");
  var frame = document.getElementById("doc");
  var token = new URLSearchParams(window.location.search).get("token");

  function show(title, text) {
    msg.innerHTML = "";
    var s = document.createElement("strong");
    s.textContent = title;
    msg.appendChild(s);
    msg.appendChild(document.createTextNode(text));
  }

  if (!token) { show("No document link provided", "Please open the link you were sent."); return; }

  fetch(SUPABASE_URL + "/functions/v1/share?format=json&token=" + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok && d.html) {
        frame.srcdoc = d.html;
        frame.style.display = "block";
        msg.style.display = "none";
      } else {
        show("Document not available", (d && d.error) || "This link may have expired or been revoked by the issuing business.");
      }
    })
    .catch(function () {
      show("Couldn't load this document", "Please check your internet connection and try again.");
    });
})();
</script>
</body>
</html>
